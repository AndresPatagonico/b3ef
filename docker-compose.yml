services:
  mongodb:
    image: mongo:latest
    container_name: shipnow-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=shipnow
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  app:
    build: .
    container_name: shipnow-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/shipnow
      - MONGODB_URI=mongodb://mongodb:27017/shipnow
    depends_on:
      mongodb:
        condition: service_healthy
    restart: always

volumes:
  mongo_data: